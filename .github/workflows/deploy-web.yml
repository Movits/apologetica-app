name: Deploy web to GitHub Pages

# Reconstrói e publica o site (landing + app web Expo) a cada push no master.
on:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'assets/**'
      - 'docs/**'
      - 'fotos/**'
      - 'App.js'
      - 'app.json'
      - 'app.config.js'
      - 'package.json'
      - 'package-lock.json'
      - 'public/**'
      # Estes mudam o bundle sem tocar em src/: sem eles, um ajuste de build
      # nao chegava ao aparelho de ninguem.
      - 'metro.config.js'
      - 'babel.config.js'
      - 'scripts/**'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Evita deploys concorrentes; não cancela um deploy em andamento.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Pega referência com source inválido, que sumiria da tela sem nenhum erro.
      - name: Check references data
        run: node scripts/check-refs.mjs

      - name: Export web build
        env:
          PAGES_BASE_URL: /apologetica-app/app
        run: npx expo export -p web

      - name: Assemble Pages site
        run: |
          mkdir -p _site
          cp docs/*.html _site/
          if [ -d fotos ]; then cp -r fotos _site/fotos; fi
          cp -r dist _site/app
          # Identidade deste build: o NOME DO ARQUIVO DO BUNDLE, que carrega
          # hash do conteudo e muda exatamente quando o codigo muda. Nao usamos
          # o sha do commit porque o Metro cacheia a config resolvida e dois
          # builds seguidos sairam com o mesmo id nos testes locais, o que
          # deixaria a verificacao sempre calada.
          BUNDLE=$(basename "$(ls _site/app/_expo/static/js/web/AppEntry-*.js | head -1)")
          printf '{"bundle":"%s"}\n' "$BUNDLE" > _site/app/version.json
          echo "version.json aponta para $BUNDLE"
          # Fallback de SPA. O GitHub Pages serve o 404.html da RAIZ do site
          # publicado, nunca um aninhado: a versao anterior ficava em
          # _site/app/404.html e por isso NUNCA era usada. Medido no ar: um
          # caminho abaixo de /app/ devolvia a pagina de erro do proprio GitHub.
          #
          # O <base> e necessario porque este arquivo e servido NA URL PEDIDA:
          # sem ele os caminhos relativos (manifest, icones, version.json)
          # resolveriam a partir da pasta errada.
          #
          # O script manda para a landing quem caiu aqui por um endereco que nao
          # e do app, para o 404 do site nao virar "abre o app pra qualquer
          # caminho errado".
          sed -e 's|<head>|<head><base href="/apologetica-app/app/"><script>if(!location.pathname.startsWith("/apologetica-app/app/")){location.replace("/apologetica-app/");}</script>|' \
            _site/app/index.html > _site/404.html
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
